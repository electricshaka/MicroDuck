# MicroDuck Got a Talent: a 20 s performance on a stage. The Arena plays your
# timeline.json (when to sit, when to stand, where to look); visitors vote.
# Nothing is timed. Make the moves yours.
event = "got-a-talent"
task  = "Mjlab-GotATalent-MicroDuck"
kind  = "perpetual"

# What the policy reads in each command group: publish writes it in the manifest.
[command]
twist = "[sit flag: 1 sit, 0 stand; headstand flag: 1 go onto the head and hold; spin flag: 1 spin counter-clockwise on the head]"
head  = "[neck_pitch, head_pitch, head_yaw, head_roll]: rad from the default pose"
body  = "[toprock flag: 1 step in place while standing, 0 stand still; downrock sweep flag: 1 sweep a leg around in the seated crouch, 0 hold the crouch; 0; 0; L-kick freeze flag: 1 hold the freeze on the head, one leg up and one leg level, 0 ordinary headstand; 0]"

[recipe]                  # the first training, as is
num_envs       = 4096
max_iterations = 3000
seed           = 1

[params.head_reward]
label = "Follow the head moves"
value = 0.75
min   = 0.0
max   = 2.0

[params.stillness_reward]
label = "Hold still between moves"
value = 2.0
min   = 0.0
max   = 4.0

[params.upright_reward]
label = "Stay upright"
value = 2.5
min   = 0.5
max   = 5.0
